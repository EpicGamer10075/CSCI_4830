<head>
   <link rel="stylesheet" href="/static/css/styles.css">
</head>

<table><tr></tr></table>

<table class="graphs">
<tr>
	<td class="graphs" style="max-width:50%">
		<canvas id="graphDur" width="800" height="400"></canvas>
	</td>
	<td class="graphs" style="max-width:50%;">
		<canvas id="graphPer" width="800" height="400"></canvas>
	</td>
</tr>
<tr>
	<td class="graphs" style="max-width:50%;">
		<canvas id="graphGol" width="800" height="400"></canvas>
	</td>
</tr></table>

<script type="text/javascript" src="/static/js/scripts.js">//loads the functions from scripts.js</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js">//loads the graphing functions from external chart.js</script>
<script>
	getTabs('{{name|tojson}}', "b", "Stats")

	let completeTimers = "{{comTimers}}".split(";");
	let names = [];
	let durs  = [];
	let percs = [];
	let focus = [];
	for(let t=0; t<completeTimers.length-1; t++) {
		let timerParts = completeTimers[t].split(",");
		//names.push(timerParts[0]); deprecated after names became IDs
		names.push("");
		durs.push(timerParts[1]);
		percs.push(timerParts[2]);
		focus.push(timerParts[1]*timerParts[2]/100);
	}
	
	let goalText  = "{{curGoal}}".split(";");
	let goal_names   = [];
	let start_dates  = [];
	let end_dates    = [];
	let target_percs = [];
	let actual_percs = []; //calculated using same method as from focus.html
	for(let t=0; t<goalText.length-1; t++) {
		let goalParts = goalText[t].split(",");
		goal_names.push("");
		start_dates.push(goalParts[1]);
		end_dates.push(goalParts[2]);
		target_percs.push(goalParts[3]);

		let totalFocus = 0.0; //amount of time focused
		let totalTimer = 0.0; //amount of time total
        for(let t=0; t<completeTimers.length-1; t++){
			let timerText = completeTimers[t].split(",");
			let date = timerText[3].substring(0, timerText[3].indexOf(" ")); //extracts date (YYYY-MM-DD)
			let endTime = timerText[3].substring(timerText[3].indexOf(" ")+1, timerText[3].lastIndexOf(":")); //extracts endTime (hr:min)
			if(goalParts[1] != "" && compareDates(goalParts[1], goalParts[2], date)){ //if goal exists and current timer within goal dates
				totalFocus += Number(timerText[1]) * Number(timerText[2]) / 100.0 //add current complete timer's duration to totalFocus
				totalTimer += Number(timerText[1]) //add current complete timer's duration to totalTimer
			}
        }
		actual_percs.push(totalFocus/totalTimer*100);
	}
	function compareDates(start, end, within){ //checks if within is inside of start and end dates, and returns boolean
		let startParts = start.split("-"); //YYYY-MM-DD -> [YYYY, MM, DD]
		let endParts = end.split("-");
		let withinParts = within.split("-");
		return (Number(startParts[0]) <= Number(withinParts[0]) && Number(withinParts[0]) <= Number(endParts[0]) &&
				Number(startParts[1]) <= Number(withinParts[1]) && Number(withinParts[1]) <= Number(endParts[1]) &&
				Number(startParts[2]) <= Number(withinParts[2]) && Number(withinParts[2]) <  Number(endParts[2]))
	}
	
	const ctxD = document.getElementById('graphDur');
	const chartDur = new Chart(ctxD, {
		type: 'line',
		data: {
			labels: names,
			datasets: [{
				label: 'Focus Amount',
				backgroundColor: 'rgba(255, 127, 127, 0.5)',
				borderColor: 'rgb(255, 127, 127)',
				data: focus,
				pointStyle: false,
				borderWidth: 5,
				fill: true
			},{
				label: 'Duration',
				backgroundColor: 'rgba(91, 127, 255, 0.5)',
				borderColor: 'rgb(91, 127, 255)',
				data: durs,
				pointStyle: false,
				borderWidth: 5,
				fill: true
			}]
		},
		options: {
			scales: {
				y: {
					beginAtZero: true,
					title: {
						display: true,
						text: 'seconds',
						color: 'rgb(127, 127, 127)',
						font: {
							family: 'Helvetica',
							size: 20,
							lineHeight: 1.2,
						},
					},
				}
			},
			plugins: {
				title: {
					display: true,
					text: 'Focus Timers',
					color: '#111',
					font: {
						family: 'Helvetica',
						size: 32,
						weight: 'bold',
						lineHeight: 1.2,
					}
				}
			}
		}
	});
	
	const ctxP = document.getElementById('graphPer');
	const chartPer = new Chart(ctxP, {
		type: 'line',
		data: {
			labels: names,
			datasets: [{
				label: 'Focus Percentage',
				backgroundColor: 'rgba(255, 127, 127, 0.5)',
				borderColor: 'rgb(255, 127, 127)',
				data: percs,
				pointStyle: false,
				borderWidth: 5,
				fill: true
			}]
		},
		options: {
			scales: {
				y: {
					beginAtZero: true,
					min: 0,
					max: 100,
					title: {
						display: true,
						text: 'percent',
						color: 'rgb(127, 127, 127)',
						font: {
							family: 'Helvetica',
							size: 20,
							lineHeight: 1.2,
						},
					},
				}
			},
			plugins: {
				title: {
					display: true,
					text: 'Focus Timers',
					color: '#111',
					font: {
						family: 'Helvetica',
						size: 32,
						weight: 'bold',
						lineHeight: 1.2,
					}
				}
			}
		}
	});
	
	const ctxG = document.getElementById('graphGol');
	const chartGol = new Chart(ctxG, {
		type: 'line',
		data: {
			labels: goal_names,
			datasets: [{
				label: 'Actual Percentage',
				backgroundColor: 'rgba(127, 127, 255, 0.5)',
				borderColor: 'rgb(127, 127, 255)',
				data: actual_percs,
				pointStyle: false,
				borderWidth: 5,
				fill: true
			},{
				label: 'Target Percentage',
				backgroundColor: 'rgba(127, 255, 127, 0.5)',
				borderColor: 'rgb(127, 255, 127)',
				data: target_percs,
				pointStyle: false,
				borderWidth: 5,
				fill: true
			}]
		},
		options: {
			scales: {
				y: {
					beginAtZero: true,
					min: 0,
					max: 100,
					title: {
						display: true,
						text: 'percent',
						color: 'rgb(127, 127, 127)',
						font: {
							family: 'Helvetica',
							size: 20,
							lineHeight: 1.2,
						},
					},
				}
			},
			plugins: {
				title: {
					display: true,
					text: 'Goals',
					color: '#111',
					font: {
						family: 'Helvetica',
						size: 32,
						weight: 'bold',
						lineHeight: 1.2,
					}
				}
			}
		}
	});
</script>
